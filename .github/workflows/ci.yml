name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-cpu:
    name: CPU build (turbol)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build g++ libgtest-dev
    
    - name: Build CPU version
      run: |
        cmake -S turbol -B turbol/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTURBORL_ENABLE_CUDA=OFF \
            -DTURBORL_ENABLE_TESTS=ON
        cmake --build turbol/build -j$(nproc)
    
    - name: Run tests
      run: ctest --test-dir turbol/build --output-on-failure

  build-cuda:
    name: CUDA build (turbol_vllm)
    runs-on: ubuntu-latest
    # Official CUDA 13.2 toolchain image: the ubuntu runner itself has no CUDA
    # toolkit, and compiling only needs nvcc — no GPU/driver is required here.
    container: nvidia/cuda:13.2.0-devel-ubuntu24.04

    steps:
    - uses: actions/checkout@v5
    
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y cmake ninja-build g++ libgtest-dev
    
    - name: Build CUDA version
      run: |
        cmake -S turbol_vllm -B turbol_vllm/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTURBORL_ENABLE_CUDA=ON \
            -DTURBORL_ENABLE_TESTS=ON \
            -DTURBORL_USE_LIBTORCH=OFF
        cmake --build turbol_vllm/build -j$(nproc)
    
    - name: Run tests
      run: ctest --test-dir turbol_vllm/build --output-on-failure
